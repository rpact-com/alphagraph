# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master]
  release:
    types: [published]
  workflow_dispatch:

name: pkgdown

jobs:
  pkgdown:
    runs-on: ubuntu-latest
    # Only restrict concurrency for non-PR jobs
    concurrency:
      group: pkgdown-${{ github.event_name != 'pull_request' || github.run_id }}
    
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_REPOSITORY: ${{ github.repository }}
    
    permissions:
      contents: write
    
    steps:
      - name: Check out repository
        uses: actions/checkout@v3

      - name: Set up Pandoc
        uses: r-lib/actions/setup-pandoc@v2

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
          
      - name: Set up R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          # Install all DESCRIPTION dependencies and the checked-out package.
          dependencies: '"all"'
          extra-packages: |
            any::pkgdown
            local::.
          needs: website

      - name: Build site
        run: pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)
        shell: Rscript {0}

      - name: Deploy to GitHub pages
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@v4.4.1
        with:
          clean: false
          branch: gh-pages
          folder: docs
          
      - name: Run package tests and write artifacts
        continue-on-error: true
        shell: Rscript {0}
        run: |
          dir.create("artifacts", recursive = TRUE, showWarnings = FALSE)
          writeLines(capture.output(sessionInfo()), "artifacts/session-info.txt")
          testthat::test_local(
            reporter = testthat::JunitReporter$new(file = "artifacts/test-results.xml"),
            stop_on_failure = TRUE
          )

      - name: Upload artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-${{ github.run_id }}
          path: artifacts/
          retention-days: 14
